<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="765" viewBox="0 0 1200 765" role="img" aria-labelledby="ttl desc">
 <title id="ttl">Dos recorridos entre conocer y actuar</title><desc id="desc">Dos recorridos conceptuales: de teoría a reconocimiento y aplicación, y de experiencia a reflexión y comprensión explícita.</desc>
 <rect width="1200" height="765" fill="#F7F5F0"/>
 <rect x="51" y="54" width="38" height="5" rx="2.5" fill="#54766D"/>
 <text x="52" y="109" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" letter-spacing="0" fill="#262B34">Dos recorridos entre conocer y actuar</text><text x="52" y="151" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" letter-spacing="0" fill="#666D74">La comprensión puede desarrollarse desde la teoría o desde la experiencia.</text><rect x="52" y="188" width="530" height="487" rx="20" fill="#FFFFFF" stroke="#D8DBDB" stroke-width="1.5"/><rect x="76" y="221" width="5" height="28" rx="2.5" fill="#54766D"/><text x="95" y="243" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.1" fill="#54766D">DEL CONCEPTO A LA ACCIÓN</text><rect x="77" y="284" width="479" height="96" rx="13" fill="#F7F5F0" stroke="#D8DBDB" stroke-width="1"/><circle cx="113" cy="332" r="17" fill="#D7E4DF"/><text x="113" y="338" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="0" fill="#54766D">1</text><text x="143" y="323" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="0" fill="#262B34">Conocimiento teórico</text><text x="143" y="352" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#666D74">Aprender una explicación</text><path d="M 317 383 v 16" fill="none" stroke="#AEB7B3" stroke-width="2" stroke-linecap="round"/><path d="M 311 395 l 6 7 6 -7" fill="none" stroke="#AEB7B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="77" y="409" width="479" height="96" rx="13" fill="#F7F5F0" stroke="#D8DBDB" stroke-width="1"/><circle cx="113" cy="457" r="17" fill="#D7E4DF"/><text x="113" y="463" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="0" fill="#54766D">2</text><text x="143" y="448" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="0" fill="#262B34">Reconocimiento contextual</text><text x="143" y="477" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#666D74">Detectar cuándo es relevante</text><path d="M 317 508 v 16" fill="none" stroke="#AEB7B3" stroke-width="2" stroke-linecap="round"/><path d="M 311 520 l 6 7 6 -7" fill="none" stroke="#AEB7B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="77" y="534" width="479" height="96" rx="13" fill="#F7F5F0" stroke="#D8DBDB" stroke-width="1"/><circle cx="113" cy="582" r="17" fill="#D7E4DF"/><text x="113" y="588" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="0" fill="#54766D">3</text><text x="143" y="573" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="0" fill="#262B34">Aplicación deliberada</text><text x="143" y="602" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#666D74">Utilizar el criterio en una situación</text><rect x="618" y="188" width="530" height="487" rx="20" fill="#FFFFFF" stroke="#D8DBDB" stroke-width="1.5"/><rect x="642" y="221" width="5" height="28" rx="2.5" fill="#A77352"/><text x="661" y="243" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.1" fill="#A77352">DE LA EXPERIENCIA A LA EXPLICACIÓN</text><rect x="643" y="284" width="479" height="96" rx="13" fill="#F7F5F0" stroke="#D8DBDB" stroke-width="1"/><circle cx="679" cy="332" r="17" fill="#D7E4DF"/><text x="679" y="338" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="0" fill="#A77352">1</text><text x="709" y="323" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="0" fill="#262B34">Experiencia acumulada</text><text x="709" y="352" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#666D74">Desarrollar habilidades al actuar</text><path d="M 883 383 v 16" fill="none" stroke="#AEB7B3" stroke-width="2" stroke-linecap="round"/><path d="M 877 395 l 6 7 6 -7" fill="none" stroke="#AEB7B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="643" y="409" width="479" height="96" rx="13" fill="#F7F5F0" stroke="#D8DBDB" stroke-width="1"/><circle cx="679" cy="457" r="17" fill="#D7E4DF"/><text x="679" y="463" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="0" fill="#A77352">2</text><text x="709" y="448" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="0" fill="#262B34">Reflexión</text><text x="709" y="477" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#666D74">Examinar aquello que ya hacemos</text><path d="M 883 508 v 16" fill="none" stroke="#AEB7B3" stroke-width="2" stroke-linecap="round"/><path d="M 877 520 l 6 7 6 -7" fill="none" stroke="#AEB7B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="643" y="534" width="479" height="96" rx="13" fill="#F7F5F0" stroke="#D8DBDB" stroke-width="1"/><circle cx="679" cy="582" r="17" fill="#D7E4DF"/><text x="679" y="588" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="0" fill="#A77352">3</text><text x="709" y="573" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="0" fill="#262B34">Comprensión explícita</text><text x="709" y="602" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#666D74">Articular principios y condiciones</text><text x="600" y="727" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" letter-spacing="0" fill="#525D60">Los recorridos pueden cruzarse o repetirse. No son etapas universales.</text></svg>