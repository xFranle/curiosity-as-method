<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">TWO PEOPLE, A SHARED BOND</title><desc id="desc">Conceptual illustration of two individuals with their own lives and an overlapping shared bond.</desc>
<rect width="1200" height="675" fill="#FCFAF7"/>
<text x="600" y="74" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" letter-spacing="1.8" fill="#303B46">TWO PEOPLE, A SHARED BOND</text>
<path d="M320 99 H880" stroke="#DED9D2" stroke-width="2"/>
<circle cx="465" cy="347" r="233" fill="#6479A3" fill-opacity=".17" stroke="#6479A3" stroke-width="3"/>
<circle cx="735" cy="347" r="233" fill="#579A87" fill-opacity=".17" stroke="#579A87" stroke-width="3"/>
<text x="320" y="305" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#435F8E">PERSON A</text>
<text x="320" y="342" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#435F8E">Own experiences</text>
<text x="320" y="374" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#435F8E">and aspirations</text>
<text x="880" y="305" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#377E6B">PERSON B</text>
<text x="880" y="342" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#377E6B">Own experiences</text>
<text x="880" y="374" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#377E6B">and aspirations</text>
<rect x="516" y="297" width="168" height="99" rx="17" fill="#25383F"/>
<text x="600" y="334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">SHARED</text>
<text x="600" y="365" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">BOND</text>
<text x="600" y="618" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#6D7880">Sharing a life does not erase either individual.</text>
</svg>