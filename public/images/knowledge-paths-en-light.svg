<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="765" viewBox="0 0 1200 765" role="img" aria-labelledby="ttl desc">
 <title id="ttl">Two paths between knowing and doing</title><desc id="desc">Two conceptual paths: theory to recognition and application, and experience to reflection and explicit understanding.</desc>
 <rect width="1200" height="765" fill="#F7F5F0"/>
 <rect x="51" y="54" width="38" height="5" rx="2.5" fill="#54766D"/>
 <text x="52" y="109" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" letter-spacing="0" fill="#262B34">Two paths between knowing and doing</text><text x="52" y="151" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" letter-spacing="0" fill="#666D74">Understanding may develop from theory or from experience.</text><rect x="52" y="188" width="530" height="487" rx="20" fill="#FFFFFF" stroke="#D8DBDB" stroke-width="1.5"/><rect x="76" y="221" width="5" height="28" rx="2.5" fill="#54766D"/><text x="95" y="243" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.1" fill="#54766D">FROM CONCEPT TO ACTION</text><rect x="77" y="284" width="479" height="96" rx="13" fill="#F7F5F0" stroke="#D8DBDB" stroke-width="1"/><circle cx="113" cy="332" r="17" fill="#D7E4DF"/><text x="113" y="338" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="0" fill="#54766D">1</text><text x="143" y="323" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="0" fill="#262B34">Conceptual knowledge</text><text x="143" y="352" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#666D74">Learn an explanation</text><path d="M 317 383 v 16" fill="none" stroke="#AEB7B3" stroke-width="2" stroke-linecap="round"/><path d="M 311 395 l 6 7 6 -7" fill="none" stroke="#AEB7B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="77" y="409" width="479" height="96" rx="13" fill="#F7F5F0" stroke="#D8DBDB" stroke-width="1"/><circle cx="113" cy="457" r="17" fill="#D7E4DF"/><text x="113" y="463" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="0" fill="#54766D">2</text><text x="143" y="448" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="0" fill="#262B34">Contextual recognition</text><text x="143" y="477" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#666D74">Notice when it is relevant</text><path d="M 317 508 v 16" fill="none" stroke="#AEB7B3" stroke-width="2" stroke-linecap="round"/><path d="M 311 520 l 6 7 6 -7" fill="none" stroke="#AEB7B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="77" y="534" width="479" height="96" rx="13" fill="#F7F5F0" stroke="#D8DBDB" stroke-width="1"/><circle cx="113" cy="582" r="17" fill="#D7E4DF"/><text x="113" y="588" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="0" fill="#54766D">3</text><text x="143" y="573" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="0" fill="#262B34">Deliberate application</text><text x="143" y="602" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#666D74">Use the principle in a situation</text><rect x="618" y="188" width="530" height="487" rx="20" fill="#FFFFFF" stroke="#D8DBDB" stroke-width="1.5"/><rect x="642" y="221" width="5" height="28" rx="2.5" fill="#A77352"/><text x="661" y="243" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.1" fill="#A77352">FROM EXPERIENCE TO EXPLANATION</text><rect x="643" y="284" width="479" height="96" rx="13" fill="#F7F5F0" stroke="#D8DBDB" stroke-width="1"/><circle cx="679" cy="332" r="17" fill="#D7E4DF"/><text x="679" y="338" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="0" fill="#A77352">1</text><text x="709" y="323" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="0" fill="#262B34">Accumulated experience</text><text x="709" y="352" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#666D74">Develop skills through action</text><path d="M 883 383 v 16" fill="none" stroke="#AEB7B3" stroke-width="2" stroke-linecap="round"/><path d="M 877 395 l 6 7 6 -7" fill="none" stroke="#AEB7B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="643" y="409" width="479" height="96" rx="13" fill="#F7F5F0" stroke="#D8DBDB" stroke-width="1"/><circle cx="679" cy="457" r="17" fill="#D7E4DF"/><text x="679" y="463" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="0" fill="#A77352">2</text><text x="709" y="448" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="0" fill="#262B34">Reflection</text><text x="709" y="477" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#666D74">Examine what we already do</text><path d="M 883 508 v 16" fill="none" stroke="#AEB7B3" stroke-width="2" stroke-linecap="round"/><path d="M 877 520 l 6 7 6 -7" fill="none" stroke="#AEB7B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="643" y="534" width="479" height="96" rx="13" fill="#F7F5F0" stroke="#D8DBDB" stroke-width="1"/><circle cx="679" cy="582" r="17" fill="#D7E4DF"/><text x="679" y="588" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="0" fill="#A77352">3</text><text x="709" y="573" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="0" fill="#262B34">Explicit understanding</text><text x="709" y="602" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#666D74">Articulate principles and conditions</text><text x="600" y="727" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" letter-spacing="0" fill="#525D60">These paths can overlap or repeat. They are not universal stages.</text></svg>