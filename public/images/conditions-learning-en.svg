<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
<title>We do more than act: we learn what to see.</title>
<rect width="1200" height="640" fill="#FCFAF6"/>
<path d="M48 48H1152" stroke="#E5E0D8" stroke-width="1"/>
<text x="60" y="90" fill="#52746C" font-family="Lato,Arial,sans-serif" font-weight="800" font-size="15" text-anchor="start">LEARNING TO BUILD POSSIBILITIES</text>
<text x="60" y="142" fill="#1E3430" font-family="Lato,Arial,sans-serif" font-weight="800" font-size="38" text-anchor="start">We do more than act: we learn what to see.</text>
<text x="60" y="185" fill="#64716C" font-family="Lato,Arial,sans-serif" font-weight="400" font-size="20" text-anchor="start">Experience can change the opportunities we notice and the choices we consider.</text>
<rect x="60" y="260" width="235" height="198" rx="18" fill="#E2EAE3" stroke="#C9D3CB"/>
<circle cx="98" cy="302" r="20" fill="#1E5B4B"/>
<text x="98" y="309" fill="#FFFFFF" font-family="Lato,Arial,sans-serif" font-weight="800" font-size="19" text-anchor="middle">1</text>
<text x="84" y="357" fill="#1B3830" font-family="Lato,Arial,sans-serif" font-weight="800" font-size="27" text-anchor="start">Explore</text>
<text x="84" y="399" fill="#4B5F57" font-family="Lato,Arial,sans-serif" font-weight="400" font-size="17" text-anchor="start">Knowledge, people,</text>
<text x="84" y="428" fill="#4B5F57" font-family="Lato,Arial,sans-serif" font-weight="400" font-size="17" text-anchor="start">and environments</text>
<path d="M300 357H335" stroke="#789589" stroke-width="2.5" stroke-linecap="round"/><path d="M326 349L335 357L326 365" fill="none" stroke="#789589" stroke-width="2.5"/>
<rect x="342" y="260" width="235" height="198" rx="18" fill="#E7EEE9" stroke="#C9D3CB"/>
<circle cx="380" cy="302" r="20" fill="#1E5B4B"/>
<text x="380" y="309" fill="#FFFFFF" font-family="Lato,Arial,sans-serif" font-weight="800" font-size="19" text-anchor="middle">2</text>
<text x="366" y="357" fill="#1B3830" font-family="Lato,Arial,sans-serif" font-weight="800" font-size="27" text-anchor="start">Recognize</text>
<text x="366" y="399" fill="#4B5F57" font-family="Lato,Arial,sans-serif" font-weight="400" font-size="17" text-anchor="start">Patterns and</text>
<text x="366" y="428" fill="#4B5F57" font-family="Lato,Arial,sans-serif" font-weight="400" font-size="17" text-anchor="start">new possibilities</text>
<path d="M582 357H617" stroke="#789589" stroke-width="2.5" stroke-linecap="round"/><path d="M608 349L617 357L608 365" fill="none" stroke="#789589" stroke-width="2.5"/>
<rect x="624" y="260" width="235" height="198" rx="18" fill="#F6EAE2" stroke="#C9D3CB"/>
<circle cx="662" cy="302" r="20" fill="#1E5B4B"/>
<text x="662" y="309" fill="#FFFFFF" font-family="Lato,Arial,sans-serif" font-weight="800" font-size="19" text-anchor="middle">3</text>
<text x="648" y="357" fill="#1B3830" font-family="Lato,Arial,sans-serif" font-weight="800" font-size="27" text-anchor="start">Intervene</text>
<text x="648" y="399" fill="#4B5F57" font-family="Lato,Arial,sans-serif" font-weight="400" font-size="17" text-anchor="start">Choices that</text>
<text x="648" y="428" fill="#4B5F57" font-family="Lato,Arial,sans-serif" font-weight="400" font-size="17" text-anchor="start">change conditions</text>
<path d="M864 357H899" stroke="#789589" stroke-width="2.5" stroke-linecap="round"/><path d="M890 349L899 357L890 365" fill="none" stroke="#789589" stroke-width="2.5"/>
<rect x="906" y="260" width="235" height="198" rx="18" fill="#E2EAE3" stroke="#C9D3CB"/>
<circle cx="944" cy="302" r="20" fill="#1E5B4B"/>
<text x="944" y="309" fill="#FFFFFF" font-family="Lato,Arial,sans-serif" font-weight="800" font-size="19" text-anchor="middle">4</text>
<text x="930" y="357" fill="#1B3830" font-family="Lato,Arial,sans-serif" font-weight="800" font-size="27" text-anchor="start">Revise</text>
<text x="930" y="399" fill="#4B5F57" font-family="Lato,Arial,sans-serif" font-weight="400" font-size="17" text-anchor="start">Evidence that</text>
<text x="930" y="428" fill="#4B5F57" font-family="Lato,Arial,sans-serif" font-weight="400" font-size="17" text-anchor="start">updates hypotheses</text>
<path d="M1024 474 V507 H179 V474" fill="none" stroke="#789589" stroke-width="1.8" stroke-dasharray="6 7"/>
<path d="M171 484L179 474L187 484" fill="none" stroke="#789589" stroke-width="2"/>
<rect x="60" y="540" width="1080" height="61" rx="15" fill="#DCE8E0"/>
<text x="600" y="580" fill="#1E5B4B" font-family="Lato,Arial,sans-serif" font-weight="700" font-size="23" text-anchor="middle">Influencing the future is not the same as controlling outcomes.</text>
<text x="600" y="627" fill="#65716D" font-family="Lato,Arial,sans-serif" font-weight="400" font-size="14" text-anchor="middle">Conceptual framework, not an inevitable sequence.</text>
</svg>