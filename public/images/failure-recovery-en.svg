<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img">
<title>The same event. Different consequences.</title>
<desc>Preparation can change what follows an unexpected failure.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto"><path d="M2 2 L9 6 L2 10" fill="none" stroke="#76827D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="720" fill="#FCFAF6"/>
<path d="M48 48 H1152" stroke="#E1DED5" stroke-width="1"/>
<text x="64" y="91" font-family="Lato, Arial, sans-serif" font-size="16" font-weight="800" fill="#52746C" text-anchor="start" letter-spacing="2.2">DECISIONS UNDER UNCERTAINTY</text>
<text x="64" y="142" font-family="Lato, Arial, sans-serif" font-size="38" font-weight="800" fill="#1E3430" text-anchor="start">The same event. Different consequences.</text>
<text x="64" y="182" font-family="Lato, Arial, sans-serif" font-size="22" font-weight="400" fill="#586560" text-anchor="start">Preparation can change what follows an unexpected failure.</text>
<rect x="395" y="219" width="410" height="75" rx="16" fill="#E4E9E4" stroke="#A9BCB2" stroke-width="1.5"/>
<circle cx="431" cy="257" r="16" fill="#A95039" opacity=".14"/>
<path d="M431 247 V259 M431 266 V268" stroke="#A95039" stroke-width="3" stroke-linecap="round"/>
<text x="605" y="266" font-family="Lato, Arial, sans-serif" font-size="23" font-weight="700" fill="#1D3833" text-anchor="middle">Unexpected server failure</text>
<path d="M600 294 V315 M600 315 H311 V340 M600 315 H889 V340" fill="none" stroke="#80918A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="64" y="355" width="510" height="176" rx="20" fill="#FFF8F5" stroke="#E0BFAE" stroke-width="2"/>
<rect x="626" y="355" width="510" height="176" rx="20" fill="#F3F8F5" stroke="#9FBDB1" stroke-width="2"/>
<circle cx="97" cy="397" r="9" fill="#BD7054"/>
<circle cx="659" cy="397" r="9" fill="#3F8069"/>
<text x="119" y="405" font-family="Lato, Arial, sans-serif" font-size="24" font-weight="800" fill="#8C4D35" text-anchor="start">Without recovery planning</text>
<text x="681" y="405" font-family="Lato, Arial, sans-serif" font-size="24" font-weight="800" fill="#28634D" text-anchor="start">With recovery planning</text>
<path d="M95 427 H541 M657 427 H1103" stroke="#DCC7BC" stroke-width="1.3"/>
<text x="97" y="462" font-family="Lato, Arial, sans-serif" font-size="22" font-weight="450" fill="#24302E" text-anchor="start">•  No tested backups</text>
<text x="97" y="497" font-family="Lato, Arial, sans-serif" font-size="22" font-weight="450" fill="#24302E" text-anchor="start">•  No defined response procedure</text>
<text x="659" y="462" font-family="Lato, Arial, sans-serif" font-size="22" font-weight="450" fill="#24302E" text-anchor="start">•  Backups and restore tests</text>
<text x="659" y="497" font-family="Lato, Arial, sans-serif" font-size="22" font-weight="450" fill="#24302E" text-anchor="start">•  Recovery roles and procedures</text>
<path d="M319 531 V552 M881 531 V552" stroke="#80918A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="64" y="568" width="510" height="99" rx="17" fill="#F4E6DE"/>
<rect x="626" y="568" width="510" height="99" rx="17" fill="#DDECE2"/>
<text x="319" y="609" font-family="Lato, Arial, sans-serif" font-size="23" font-weight="800" fill="#844C39" text-anchor="middle">Disruption may escalate</text>
<text x="319" y="641" font-family="Lato, Arial, sans-serif" font-size="17" font-weight="400" fill="#785E55" text-anchor="middle">Long downtime or data loss</text>
<text x="881" y="609" font-family="Lato, Arial, sans-serif" font-size="23" font-weight="800" fill="#28634D" text-anchor="middle">Recovery can be faster</text>
<text x="881" y="641" font-family="Lato, Arial, sans-serif" font-size="17" font-weight="400" fill="#52685B" text-anchor="middle">Less disruption, not zero risk</text>
<text x="600" y="699" font-family="Lato, Arial, sans-serif" font-size="16" font-weight="400" fill="#66726D" text-anchor="middle">Conceptual example · neither outcome is guaranteed</text>
</svg>