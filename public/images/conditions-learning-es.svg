<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
<title>No solo actuamos: aprendemos a reconocer.</title>
<rect width="1200" height="640" fill="#FCFAF6"/>
<path d="M48 48H1152" stroke="#E5E0D8" stroke-width="1"/>
<text x="60" y="90" fill="#52746C" font-family="Lato,Arial,sans-serif" font-weight="800" font-size="15" text-anchor="start">APRENDER A CONSTRUIR POSIBILIDADES</text>
<text x="60" y="142" fill="#1E3430" font-family="Lato,Arial,sans-serif" font-weight="800" font-size="38" text-anchor="start">No solo actuamos: aprendemos a reconocer.</text>
<text x="60" y="185" fill="#64716C" font-family="Lato,Arial,sans-serif" font-weight="400" font-size="20" text-anchor="start">La experiencia puede cambiar qué oportunidades vemos y qué decisiones consideramos.</text>
<rect x="60" y="260" width="235" height="198" rx="18" fill="#E2EAE3" stroke="#C9D3CB"/>
<circle cx="98" cy="302" r="20" fill="#1E5B4B"/>
<text x="98" y="309" fill="#FFFFFF" font-family="Lato,Arial,sans-serif" font-weight="800" font-size="19" text-anchor="middle">1</text>
<text x="84" y="357" fill="#1B3830" font-family="Lato,Arial,sans-serif" font-weight="800" font-size="27" text-anchor="start">Explorar</text>
<text x="84" y="399" fill="#4B5F57" font-family="Lato,Arial,sans-serif" font-weight="400" font-size="17" text-anchor="start">Conocimientos,</text>
<text x="84" y="428" fill="#4B5F57" font-family="Lato,Arial,sans-serif" font-weight="400" font-size="17" text-anchor="start">relaciones y entornos</text>
<path d="M300 357H335" stroke="#789589" stroke-width="2.5" stroke-linecap="round"/><path d="M326 349L335 357L326 365" fill="none" stroke="#789589" stroke-width="2.5"/>
<rect x="342" y="260" width="235" height="198" rx="18" fill="#E7EEE9" stroke="#C9D3CB"/>
<circle cx="380" cy="302" r="20" fill="#1E5B4B"/>
<text x="380" y="309" fill="#FFFFFF" font-family="Lato,Arial,sans-serif" font-weight="800" font-size="19" text-anchor="middle">2</text>
<text x="366" y="357" fill="#1B3830" font-family="Lato,Arial,sans-serif" font-weight="800" font-size="27" text-anchor="start">Reconocer</text>
<text x="366" y="399" fill="#4B5F57" font-family="Lato,Arial,sans-serif" font-weight="400" font-size="17" text-anchor="start">Patrones y</text>
<text x="366" y="428" fill="#4B5F57" font-family="Lato,Arial,sans-serif" font-weight="400" font-size="17" text-anchor="start">posibilidades nuevas</text>
<path d="M582 357H617" stroke="#789589" stroke-width="2.5" stroke-linecap="round"/><path d="M608 349L617 357L608 365" fill="none" stroke="#789589" stroke-width="2.5"/>
<rect x="624" y="260" width="235" height="198" rx="18" fill="#F6EAE2" stroke="#C9D3CB"/>
<circle cx="662" cy="302" r="20" fill="#1E5B4B"/>
<text x="662" y="309" fill="#FFFFFF" font-family="Lato,Arial,sans-serif" font-weight="800" font-size="19" text-anchor="middle">3</text>
<text x="648" y="357" fill="#1B3830" font-family="Lato,Arial,sans-serif" font-weight="800" font-size="27" text-anchor="start">Intervenir</text>
<text x="648" y="399" fill="#4B5F57" font-family="Lato,Arial,sans-serif" font-weight="400" font-size="17" text-anchor="start">Decisiones que</text>
<text x="648" y="428" fill="#4B5F57" font-family="Lato,Arial,sans-serif" font-weight="400" font-size="17" text-anchor="start">alteran condiciones</text>
<path d="M864 357H899" stroke="#789589" stroke-width="2.5" stroke-linecap="round"/><path d="M890 349L899 357L890 365" fill="none" stroke="#789589" stroke-width="2.5"/>
<rect x="906" y="260" width="235" height="198" rx="18" fill="#E2EAE3" stroke="#C9D3CB"/>
<circle cx="944" cy="302" r="20" fill="#1E5B4B"/>
<text x="944" y="309" fill="#FFFFFF" font-family="Lato,Arial,sans-serif" font-weight="800" font-size="19" text-anchor="middle">4</text>
<text x="930" y="357" fill="#1B3830" font-family="Lato,Arial,sans-serif" font-weight="800" font-size="27" text-anchor="start">Revisar</text>
<text x="930" y="399" fill="#4B5F57" font-family="Lato,Arial,sans-serif" font-weight="400" font-size="17" text-anchor="start">Evidencia que</text>
<text x="930" y="428" fill="#4B5F57" font-family="Lato,Arial,sans-serif" font-weight="400" font-size="17" text-anchor="start">corrige hipótesis</text>
<path d="M1024 474 V507 H179 V474" fill="none" stroke="#789589" stroke-width="1.8" stroke-dasharray="6 7"/>
<path d="M171 484L179 474L187 484" fill="none" stroke="#789589" stroke-width="2"/>
<rect x="60" y="540" width="1080" height="61" rx="15" fill="#DCE8E0"/>
<text x="600" y="580" fill="#1E5B4B" font-family="Lato,Arial,sans-serif" font-weight="700" font-size="23" text-anchor="middle">Influir sobre el futuro no equivale a controlar sus resultados.</text>
<text x="600" y="627" fill="#65716D" font-family="Lato,Arial,sans-serif" font-weight="400" font-size="14" text-anchor="middle">Esquema conceptual, no una secuencia inevitable.</text>
</svg>