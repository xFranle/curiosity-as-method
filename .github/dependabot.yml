version: 2

# Version updates are batched weekly and delayed by a cooldown so a freshly
# published (and possibly compromised) release is not proposed the same day.
# Security updates are separate: they ignore the cooldown and arrive immediately.
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      groups:
          actions:
              patterns: ["*"]
      commit-message:
          prefix: "chore(deps)"

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
          semver-major-days: 30
      groups:
          minor-and-patch:
              update-types: [minor, patch]
      commit-message:
          prefix: "chore(deps)"
