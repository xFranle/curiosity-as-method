name: Deploy to GitHub Pages

# Publishes the site on every push to main (and on demand from the Actions tab).
#
# Security model:
#  - The build job runs repository and dependency code, so it only gets a
#    read-only token. It never receives the Pages / OIDC permissions.
#  - The deploy job holds the privileged permissions but runs no repository code:
#    it only publishes the artifact produced by the build job.
#  - Every third-party action is pinned to a full commit SHA (the comment keeps
#    the human-readable version, which Dependabot uses to propose updates).

on:
    push:
        branches: [main]
    workflow_dispatch:

# Deny everything by default; each job asks for exactly what it needs.
permissions: {}

# One deployment at a time; never cancel one that is already publishing.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Reads the exact pnpm version from "packageManager" in package.json.
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            # No dependency cache on purpose: a poisoned cache is a classic way to
            # smuggle code into a deployment, and a fresh install takes seconds.
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  package-manager-cache: false

            # Fails if package.json and the lockfile disagree; installs exactly what was reviewed.
            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Type-check
              run: pnpm run check

            # Astro build, social cards (Satori + sharp) and the Pagefind index.
            - name: Build site, social cards and search index
              run: pnpm run build

            - name: Verify output
              run: |
                  test -f dist/index.html
                  test -f dist/es/index.html
                  test -d dist/pagefind
                  test -f dist/sitemap.xml
                  test -f dist/CNAME

            - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
