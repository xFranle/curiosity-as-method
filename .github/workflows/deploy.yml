name: Deploy to GitHub Pages

# Publishes the site on every push to main. It can also be run by hand from the
# Actions tab. The build is: install -> type-check -> build (Astro, social cards
# and the Pagefind index are all generated by `pnpm run build`) -> publish.

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Type-check
              run: pnpm run check

            # Runs `astro build` (pages + /og/ social cards through Satori + sharp)
            # followed by Pagefind, which indexes dist/ per language.
            - name: Build site, social cards and search index
              run: pnpm run build

            - name: Verify output
              run: |
                  test -f dist/index.html
                  test -f dist/es/index.html
                  test -d dist/pagefind
                  test -f dist/sitemap.xml
                  test -f dist/CNAME

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
