name: CI

# Validates every pull request (including the ones Dependabot opens) before it can
# reach main, so a dependency or workflow update is never merged unverified.
# Runs with a read-only token and no secrets; it never deploys.

on:
    pull_request:
    workflow_dispatch:

permissions: {}

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: Check and build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  package-manager-cache: false

            - run: pnpm install --frozen-lockfile
            - run: pnpm run check
            - run: pnpm run build

            # Known vulnerabilities in what actually ships to visitors.
            - name: Audit production dependencies
              run: pnpm audit --prod --audit-level=high

    workflows:
        name: Lint workflows (zizmor)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Static analysis for workflow weaknesses: unpinned actions, excessive
            # permissions, template injection, cache poisoning, and similar.
            - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
              with:
                  version: v1.31.1
                  advanced-security: false

    dependency-review:
        name: Dependency review
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Blocks a pull request that introduces a dependency with a known high or critical advisory.
            - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
              with:
                  fail-on-severity: high
